<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>樂團譜架 · Orchestra Stand</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--bg:#101418;--panel:#1a2027;--panel2:#222b34;--text:#e8edf2;--muted:#93a1b0;
    --accent:#4da3ff;--gold:#ffcc4d;--danger:#ff6b6b;--ok:#4dd882;--hh:64px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  header{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--panel);padding:10px 12px;
    display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;cursor:pointer}
  .pill{background:var(--panel2);border:1px solid #33414f;color:var(--text);border-radius:999px;
    padding:8px 10px;font-size:13px;cursor:pointer;min-height:38px;text-decoration:none;
    display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
  .pill.role{border-color:var(--accent);color:var(--accent);font-weight:700}
  .pill.role.admin{border-color:var(--gold);color:var(--gold)}
  #view{padding:16px;max-width:860px;margin:0 auto;
    padding-top:calc(var(--hh) + 16px);padding-bottom:120px}
  .card{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 4px;font-size:16px;word-break:break-all}
  .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;
    border-radius:12px;padding:12px 14px;font-size:15px;min-height:46px;cursor:pointer;
    background:var(--panel2);color:var(--text)}
  .btn.primary{background:var(--accent);color:#04121f;font-weight:700}
  .btn.warn{background:var(--danger);color:#2b0505;font-weight:700}
  .btn.gold{background:var(--gold);color:#241b02;font-weight:700}
  .btn.sm{min-height:38px;padding:8px 12px;font-size:13px}
  .btn:disabled{opacity:.35;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input[type=password]{width:100%;background:var(--panel2);border:1px solid #33414f;
    color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;margin:8px 0}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:#000e;
    color:#fff;padding:13px 18px;border-radius:12px;z-index:99;max-width:92%;
    white-space:pre-line;text-align:center;font-size:14px;display:none}
  .badge{background:var(--panel2);border:1px solid #33414f;border-radius:999px;
    padding:5px 10px;font-size:12px;white-space:nowrap}
  .badge.live-gold{border-color:var(--gold);color:var(--gold);font-weight:700}
  .badge.liveRed{border-color:var(--danger);color:#fff;background:var(--danger);
    font-weight:700;animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  #liveBanner{background:linear-gradient(135deg,#3a2f08,#2a230a);border:1px solid var(--gold);
    border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;
    gap:10px;flex-wrap:wrap}
  #liveBanner .txt{flex:1;min-width:160px}
  #liveBanner .txt b{color:var(--gold)}
  #crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-bottom:12px;
    font-size:14px;line-height:2}
  #crumbs a{color:var(--accent);cursor:pointer;text-decoration:none;padding:2px 6px;
    border-radius:8px;background:var(--panel)}
  #crumbs .sep{color:var(--muted)}
  .homeTabs{display:flex;gap:8px;margin-bottom:14px}
  .htab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--panel);border:2px solid #33414f;color:var(--muted);
    border-radius:12px;padding:11px 10px;font-size:14px;font-weight:700;
    cursor:pointer;min-height:46px}
  .htab.on{border-color:var(--accent);color:var(--accent);background:var(--panel2)}
  .viewer{position:fixed;left:0;right:0;bottom:0;top:var(--hh);
    background:var(--bg);display:flex;flex-direction:column;z-index:30}
  .vtop{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
    flex-shrink:0}
  .vtop .title{font-weight:700;font-size:14px;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp{background:var(--panel);border-top:1px solid #2a3540;flex-shrink:0}
  .ghead{width:100%;display:flex;align-items:center;justify-content:space-between;
    background:none;border:none;color:var(--text);font-size:13px;font-weight:700;
    padding:9px 14px;cursor:pointer}
  .ghead .arr{transition:transform .2s;color:var(--muted)}
  .grp.open .ghead .arr{transform:rotate(180deg)}
  .gbody{display:none;align-items:center;gap:8px;padding:2px 12px 10px;overflow-x:auto}
  .grp.open .gbody{display:flex}
  .tbtn{background:var(--panel2);border:2px solid #33414f;color:var(--text);border-radius:10px;
    min-width:38px;height:38px;font-size:15px;cursor:pointer;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;padding:0 9px;white-space:nowrap}
  .tbtn.active{border-color:var(--gold);color:var(--gold)}
  .tbtn.liveOn{border-color:var(--danger);color:#fff;background:var(--danger);
    animation:blink 1.2s infinite}
  .swatch{width:34px;height:34px;border-radius:50%;background:#fff;
    border:2px solid #566572;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;padding:0}
  .swatch span{width:20px;height:20px;border-radius:50%;display:block}
  .swatch.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
  #fabDock{position:absolute;right:12px;bottom:96px;z-index:36;display:none;
    flex-direction:column;align-items:center;gap:8px}
  .fabActions{display:none;flex-direction:column;gap:8px}
  .fabMini{width:46px;height:46px;border-radius:50%;border:2px solid #33414f;
    background:var(--panel2);font-size:18px;cursor:pointer;padding:0;line-height:1}
  .fabMini.active{border-color:var(--gold);color:var(--gold)}
  #fab{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);
    background:var(--panel2);color:var(--gold);font-size:20px;cursor:pointer;padding:0;
    line-height:1;touch-action:none;user-select:none;-webkit-user-select:none}
  #fsExit{position:absolute;top:10px;right:10px;z-index:37;display:none}
  .pop{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
    background:var(--panel);border:1px solid #33414f;border-radius:14px;padding:14px 16px;
    display:none;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.7);width:min(92vw,360px)}
  .pop input[type=range]{width:100%;height:30px;margin:4px 0 2px;accent-color:var(--accent)}
  .plabel{font-size:12px;color:var(--muted);margin:8px 0 4px}
  #printPop label{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:14px}
  #printPop input[type=radio]{accent-color:var(--accent);width:17px;height:17px}
  #textPop textarea{width:100%;background:var(--panel2);border:1px solid #33414f;
    color:var(--text);border-radius:12px;padding:10px 12px;font-size:15px;resize:vertical;margin-top:6px}
  #annPop input[type=text]{width:100%;background:var(--panel2);border:1px solid #33414f;
    color:var(--text);border-radius:12px;padding:11px 13px;font-size:15px;margin:6px 0}
  #annPop textarea{width:100%;background:var(--panel2);border:1px solid #33414f;
    color:var(--text);border-radius:12px;padding:11px 13px;font-size:15px;resize:vertical;
    margin:6px 0;min-height:110px}
  #annPop label{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}
  #annPop input[type=checkbox]{accent-color:var(--gold);width:18px;height:18px}
  .annPinned{border:1px solid var(--gold)}
  .annBody{font-size:14px;line-height:1.8;color:#dfe7ee;white-space:pre-wrap;
    word-break:break-word;margin-bottom:8px}
  .overlay{position:fixed;left:0;right:0;top:0;bottom:0;background:#000b;
    z-index:80;display:none}
  .centerPop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    background:var(--panel);border-radius:18px;padding:18px 16px;display:none;
    box-shadow:0 10px 40px rgba(0,0,0,.8);width:min(92vw,400px);
    max-height:86vh;overflow:auto;z-index:81}
  #clearPop{border:2px solid var(--danger)}
  #layerPop{border:2px solid var(--accent)}
  #fileMenuPop{border:2px solid var(--accent)}
  #annPop{border:2px solid var(--accent)}
  #hintPop{border:2px solid var(--ok);z-index:85}
  #hintOverlay{z-index:84}
  .centerPop h3{margin:0 0 10px;font-size:17px;text-align:center;word-break:break-all}
  #clearBody{font-size:14px;line-height:1.8;color:#dfe7ee}
  #clearBody b{color:var(--gold)}
  #clearBody .own{background:var(--panel2);border-radius:8px;padding:2px 10px;
    display:inline-block;margin:2px 0}
  .hintStep{background:var(--panel2);border-radius:10px;padding:9px 12px;margin:7px 0;
    font-size:14px;line-height:1.6}
  .hintStep b{color:var(--gold)}
  .menuBtn{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel2);
    border:none;color:var(--text);border-radius:10px;padding:12px 14px;font-size:15px;
    cursor:pointer;margin:5px 0;text-align:left}
  .menuBtn.danger{color:var(--danger)}
  #undoChip{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:70;
    display:none;border-color:var(--gold);color:var(--gold);font-weight:700}
  .lrow{display:flex;align-items:center;gap:8px;padding:9px 4px;
    border-bottom:1px solid #2a3540;font-size:14px}
  .lrow:last-child{border-bottom:none}
  .lrow input[type=radio]{accent-color:var(--accent);width:17px;height:17px;flex-shrink:0}
  .lrow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .del{background:none;border:none;color:var(--danger);font-size:16px;
    cursor:pointer;padding:4px 8px;flex-shrink:0}
  #rolePop{position:fixed;top:calc(var(--hh) + 4px);right:8px;z-index:65;
    background:var(--panel);border:1px solid var(--accent);border-radius:14px;
    padding:14px;min-width:min(86vw,310px);max-height:76vh;overflow:auto;display:none;
    box-shadow:0 8px 30px rgba(0,0,0,.7)}
  #rolePop .rTitle{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--accent)}
  #rolePop .rNow{background:var(--panel2);border-radius:10px;padding:9px 12px;
    font-size:14px;margin-bottom:8px;line-height:1.6}
  #rolePop .liveBox{border:1px solid var(--danger);border-radius:10px;padding:9px 12px;
    font-size:14px;margin-bottom:8px;background:#2a1215}
  #rolePop .liveBox b{color:#ff8a8a}
  #rolePop .btn{width:100%;margin-top:7px}
  #rolePop .sep{border-top:1px solid #2a3540;margin:9px 0}
  #stage{flex:1;overflow:auto;padding:8px}
  #zoomWrap{position:relative;margin:0 auto;width:max-content;transform-origin:top center}
  #stage.drawing{outline:2px dashed var(--gold);outline-offset:-2px}
  #pdfCanvas{background:#fff;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.5);
    max-width:none;display:block}
  .vctrl{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;
    background:var(--panel);flex-shrink:0;flex-wrap:wrap}
  .pagenum{font-size:14px;color:var(--muted);min-width:80px;text-align:center}
  body.fs-mode header, body.fs-mode .vtop, body.fs-mode .grp, body.fs-mode .vctrl{display:none}
  body.fs-mode .viewer{top:0}
  body.fs-mode #fsExit{display:inline-flex}
  body.fs-mode #fabDock{display:none!important}
  #printArea{display:none}
  @media print{
    @page{margin:8mm}
    body.printing > *:not(#printArea){display:none!important}
    body.printing #printArea{display:block!important}
    #printArea img{width:100%;display:block;page-break-after:always}
    #printArea img:last-child{page-break-after:auto}
  }
  .center{text-align:center}
  .spinner{width:38px;height:38px;border:4px solid #33414f;border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  details{background:var(--panel);border-radius:12px;padding:11px 14px;margin-bottom:10px}
  summary{font-weight:700;cursor:pointer;font-size:14px}
  details div{margin-top:9px;line-height:1.8;font-size:13px;color:#cdd7e1}
  details b{color:var(--gold)}
  .step{background:var(--panel2);border-radius:10px;padding:8px 12px;margin:6px 0}
  .tbl{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
  .tbl th,.tbl td{border:1px solid #33414f;padding:6px 8px;text-align:left}
  .tbl th{background:var(--panel2);color:var(--gold)}
  #gateWrap{min-height:70vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center}
  #gateWrap .lock{font-size:52px;margin-bottom:8px}
  #gateWrap h2{margin:0 0 6px;font-size:22px}
  #gateWrap p{color:var(--muted);font-size:14px;max-width:320px;line-height:1.7}
  #gateCard{background:var(--panel);border-radius:16px;padding:22px 20px;
    width:min(92vw,360px);margin-top:14px}
  .clipInfo{background:#2a230a;border:1px solid var(--gold);border-radius:10px;
    padding:8px 12px;font-size:13px;margin-bottom:10px;color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1 id="appTitle" onclick="if(gatePassed()){state.homeTab='library';location.hash='#/library';}">🎼 樂團譜架</h1>
  <button class="pill role" id="roleBtn" onclick="toggleRolePop()">👤 ▾</button>
  <a class="pill" href="#/help">❓</a>
  <button class="pill" id="langBtn" onclick="toggleLang()">EN</button>
</header>
<div id="view"></div>
<div class="toast" id="toast"></div>
<button class="pill" id="undoChip" onclick="undoCleared()">↩️ 復原清除</button>
<div id="printArea"></div>

<div class="overlay" id="clearOverlay"></div>
<div class="centerPop" id="clearPop">
  <h3 id="clearTitle"></h3>
  <div id="clearBody"></div>
  <button class="btn warn" id="clearGo" style="width:100%;min-height:52px;margin-top:12px"></button>
  <button class="btn" id="clearCancel" onclick="closeClearPop()"
    style="width:100%;min-height:48px;margin-top:8px"></button>
</div>

<div class="overlay" id="layerOverlay" onclick="closeLayerPop()"></div>
<div class="centerPop" id="layerPop">
  <h3 id="layerTitle">🗂️</h3>
  <div id="layerList"></div>
  <div id="alphaRow" style="display:none">
    <div class="plabel" id="layerAlphaLabel"></div>
    <input type="range" id="layerAlphaR" min="10" max="100" step="5">
  </div>
  <div class="plabel" id="layerHint" style="font-size:12px;color:var(--muted)"></div>
  <input type="file" id="layerFile" accept="application/pdf" style="display:none">
  <div class="row" style="margin-top:10px;justify-content:flex-end">
    <button class="btn primary" id="layerUploadBtn" style="display:none"
      onclick="uploadLayer()">⬆️</button>
    <button class="btn" id="layerCloseBtn" onclick="closeLayerPop()"></button>
  </div>
</div>

<div class="overlay" id="fileMenuOverlay" onclick="closeFileMenu()"></div>
<div class="centerPop" id="fileMenuPop">
  <h3 id="fileMenuTitle"></h3>
  <div id="fileMenuBody"></div>
  <button class="btn" id="fileMenuCancel" style="width:100%;margin-top:8px"
    onclick="closeFileMenu()"></button>
</div>

<div class="overlay" id="annOverlay" onclick="closeAnnModal()"></div>
<div class="centerPop" id="annPop">
  <h3 id="annPopTitle"></h3>
  <input type="text" id="annTitleInput" maxlength="120">
  <textarea id="annBodyInput" maxlength="4000"></textarea>
  <label><input type="checkbox" id="annPinInput"><span id="annPinLabel"></span></label>
  <div class="row" style="margin-top:10px;justify-content:flex-end">
    <button class="btn" onclick="closeAnnModal()" id="annCancelBtn"></button>
    <button class="btn primary" onclick="saveAnnouncement()" id="annSaveBtn"></button>
  </div>
</div>

<div class="overlay" id="hintOverlay" onclick="closeHint()"></div>
<div class="centerPop" id="hintPop">
  <h3 id="hintT"></h3>
  <div id="hintBody"></div>
  <button class="btn primary" style="width:100%;min-height:50px;margin-top:12px"
    onclick="closeHint()">✅</button>
</div>

<div id="rolePop"></div>

/* ================= 小工具 ================= */
const $ = id => document.getElementById(id);
function esc(s){ return String(s??'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> el.style.display='none', 2800);
}
function fmtSize(n){
  if(!n) return '';
  if(n > 1048576) return (n/1048576).toFixed(1)+' MB';
  return Math.round(n/1024)+' KB';
}
function fmtTh(v){ return (v % 1 === 0) ? String(v) : v.toFixed(1); }
function isWrongPw(err){ return err && String(err.message||'').includes('WRONG_PASSWORD'); }
function dbErrMsg(err){
  const m = String((err && err.message) || '');
  if(isWrongPw(err)) return t('needAdmin');
  if(m.includes('EDITORS_FULL')) return t('editorsFull');
  if(m.includes('SLOT_LOST')) return t('slotLost');
  if(m.includes('FOLDER_NOT_EMPTY')) return t('folderNotEmpty');
  if(m.includes('BAD_TARGET')) return t('badTarget');
  return (err && err.message) || 'Error';
}
function fitHeader(){
  const h = document.querySelector('header');
  if(h) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px');
}
function isMine(s){ return !!state.myName && String(s.drawer_name||'') === state.myName; }
function ownerOf(s){ return s.drawer_name || '—'; }
function parseStroke(s){
  const m = String(s).match(/^(P|HL|DS|LN|LD|Π|V)?#([0-9a-fA-F]{3,8})(?:~([\d.]+))?(?:~([\d.]+))?$/);
  if(!m) return { kind:'P', hex:'#ff5252', th:3, sc:1 };
  return { kind:m[1]||'P', hex:'#'+m[2], th:parseFloat(m[3])||3, sc:parseFloat(m[4])||1 };
}
function encodeStroke(kind, hex, th, sc){
  const pre = (kind === 'P') ? '' : kind;
  if(kind === 'Π' || kind === 'V') return pre + hex + '~' + (th||3) + '~' + (sc||1);
  return pre + hex + '~' + (th||3);
}
function guessColorKey(hex){
  for(const k in COLORS)
    if(COLORS[k].toLowerCase() === String(hex||'').toLowerCase()) return k;
  return 'black';
}
function inViewerPage(){ return location.hash.startsWith('#/view'); }
function isHome(){
  return location.hash === '#/library' || location.hash === '' || location.hash === '#/';
}
function nameIsSafe(n){
  const pws = [state.editPw, state.adminPw].filter(p => p && p.length >= 4);
  return !pws.some(p => String(n||'').includes(p));
}
function askSafeName(defVal){
  for(let i = 0; i < 3; i++){
    const n = prompt(t('askName'), defVal || '');
    if(n == null) return null;
    const v = n.trim().slice(0, 24);
    if(!v) return null;
    if(!nameIsSafe(v)){ toast(t('nameUnsafe')); defVal = ''; continue; }
    return v;
  }
  return null;
}
function gatePassed(){ return localStorage.getItem('gateOk') === '1'; }
function closeAllPops(){
  closeClearPop(); closeLayerPop(); closeRolePop(); closeFileMenu(); closeAnnModal();
  toggleThickPop(false);
  const tp=$('textPop'); if(tp) tp.style.display='none';
  const pp=$('printPop'); if(pp) pp.style.display='none';
}

/* ================= S Pen 按鈕：暫時點擦 ================= */
function setTempErase(on){
  if(on){
    if(state._tempErase || state.tool === 'erase') return;
    if(!canEdit()) return;
    state._tempErase = true;
    state._preEraseTool = state.tool;
    state.tool = 'erase';
    applyTouchAction(); updateToolsUI();
  }else{
    if(!state._tempErase) return;
    state._tempErase = false;
    state.tool = state._preEraseTool;
    state._preEraseTool = null;
    applyTouchAction(); updateToolsUI();
  }
}

/* ================= 路由 ================= */
window.addEventListener('hashchange', () => { if(gatePassed()) route(); else renderGate(); });
async function route(){
  fitHeader(); closeAllPops();
  if(location.hash.startsWith('#/view/')) await renderView(location.hash.split('/')[2]);
  else if(location.hash.startsWith('#/help')) renderHelp();
  else await renderHome();
}

  $('langBtn').textContent = (lang === 'zh') ? 'EN' : '中';
  $('roleBtn').style.display = 'none';
  $('view').innerHTML = `

      <div class="lock">${t('gateLock')}</div>
      <h2>${t('gateTitle')}</h2>
      <p>${t('gateDesc').replace(/\n/g,'<br>')}</p>
      <div id="gateCard">
        <input type="password" id="gateInput" placeholder="${t('gatePh')}"
          onkeydown="if(event.key==='Enter')gateSubmit()">
        <button class="btn primary" style="width:100%" onclick="gateSubmit()">${t('gateEnter')}</button>
      </div>
    </div>`;
}
async function gateSubmit(){

function bindLongPress(){
  let lpTimer = null;
  const bind = (el, fn) => {
    const start = () => { lpTimer = setTimeout(fn, 550); };
    const cancel = () => { if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; } };
    el.addEventListener('contextmenu', e => { e.preventDefault(); fn(); });
    el.addEventListener('touchstart', start, { passive:true });
    el.addEventListener('touchmove', cancel, { passive:true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchcancel', cancel);
  };
  document.querySelectorAll('[data-sid]').forEach(el =>
    bind(el, () => openScoreMenu(el.dataset.sid)));
  document.querySelectorAll('[data-fid]').forEach(el =>
    bind(el, () => openFolderMenu(el.dataset.fid)));
}

async function handleFiles(files){
  if(!files || files.length === 0) return;
  const prog = $('uploadProgress');
  const total = files.length;
  for(let i = 0; i < total; i++){
    const f = files[i];
    prog.textContent = `⏳ ${t('uploading')} (${i+1}/${total}): ${f.name}`;
    try{
      const buf = new Uint8Array(await f.arrayBuffer());
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      const pageCount = doc.numPages; doc.destroy();
      const safeName = f.name.replace(/[^\w.\-\u4e00-\u9fa5]/g, '_');
      const path = Date.now() + '_' + safeName;
      const up = await db.storage.from('scores').upload(path, f,
        { contentType:'application/pdf', upsert:false });
      if(up.error) throw up.error;
      const r = await db.rpc('create_score_ex', {
        p_admin_pw: state.adminPw,
        p_title: f.name.replace(/\.pdf$/i, '').slice(0,120),
        p_file_path: path, p_file_size: f.size, p_page_count: pageCount,
        p_folder_id: state.currentFolder });
      if(r.error){
        db.storage.from('scores').remove([path]);
        throw r.error;
      }
    }catch(err){
      if(isWrongPw(err)){ toast(t('needAdmin')); return; }
      toast('Error: '+err.message);
    }
  }
  prog.textContent = t('uploadDone');
  toast(t('uploadDone'));
  setTimeout(renderHome, 800);
}

async function doDelete(id){

  const { error } = await db.rpc('delete_score',
    { p_admin_pw: state.adminPw, p_score_id: id });
  if(error){ toast(dbErrMsg(error)); return; }
  if(s && s.file_path){
    try{
      const r = await db.from('scores').select('id')
        .eq('file_path', s.file_path);
      if(!r.data || r.data.length === 0){
        await db.storage.from('scores').remove([s.file_path]);
      }
    }catch(e){}
  }
  toast(t('delOk'));
  renderHome();
}

const FAB = { sx:null, sy:0, ox:0, oy:0, moved:false, dock:null };
function setupFab(){
  const dock = $('fabDock'), fab = $('fab');
  if(!dock || !fab) return;
  FAB.dock = dock;
  const saved = JSON.parse(localStorage.getItem('fabPos') || 'null');
  if(saved && saved.x != null){
    dock.style.left = saved.x + 'px'; dock.style.top = saved.y + 'px';
    dock.style.right = 'auto'; dock.style.bottom = 'auto';
  }
  const down = e => {
    const p = e.touches ? e.touches[0] : e;
    FAB.sx = p.clientX; FAB.sy = p.clientY;
    const r = dock.getBoundingClientRect();
    FAB.ox = r.left; FAB.oy = r.top; FAB.moved = false;
    if(e.cancelable) e.preventDefault();
  };
  const move = e => {
    if(FAB.sx == null || !FAB.dock) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - FAB.sx, dy = p.clientY - FAB.sy;
    if(!FAB.moved && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) FAB.moved = true;
    if(FAB.moved){
      const d = FAB.dock;
      const viewer = d.closest('.viewer') || document.body;
      const vr = viewer.getBoundingClientRect();
      const r = d.getBoundingClientRect();
      const nx = Math.min(Math.max(vr.left + 4, FAB.ox + dx), vr.right - r.width - 4);
      const ny = Math.min(Math.max(vr.top + 4, FAB.oy + dy), vr.bottom - r.height - 4);
      d.style.left = (nx - vr.left) + 'px';
      d.style.top = (ny - vr.top) + 'px';
      d.style.right = 'auto'; d.style.bottom = 'auto';
    }
    if(e.cancelable) e.preventDefault();
  };
  const up = () => {
    if(FAB.sx == null) return;
    if(FAB.moved && FAB.dock){
      localStorage.setItem('fabPos', JSON.stringify({
        x: parseFloat(FAB.dock.style.left), y: parseFloat(FAB.dock.style.top) }));
    }else{
      fabToggleMini();
    }
    FAB.sx = null;
  };
  fab.addEventListener('touchstart', down, { passive:false });
  fab.addEventListener('touchmove', move, { passive:false });
  fab.addEventListener('touchend', up);
  fab.addEventListener('mousedown', down);
  if(!window.__fabWin){
    window.__fabWin = true;
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  }
}

async function loadLayers(scoreId){
  try{
    const { data } = await db.from('layers').select('*')
      .eq('score_id', scoreId).order('created_at');
    state.layers = data || [];
  }catch(e){ state.layers = []; }
  if(state.layerSel && !state.layers.find(l => l.id === state.layerSel)){
    state.layerSel = null;
  }
  renderLayer(); updateLayerBtn();
}
function updateLayerBtn(){
  const b = $('layerBtn');
  if(b) b.classList.toggle('active', !!state.layerSel);
}
async function getLayerDoc(layer){
  if(layerDocs.has(layer.id)) return layerDocs.get(layer.id);
  const url = `${SUPABASE_URL}/storage/v1/object/public/scores/${layer.file_path}`;
  const doc = await pdfjsLib.getDocument(url).promise;
  layerDocs.set(layer.id, doc);
  return doc;
}
async function renderLayer(){
  const lc = $('layerCanvas'); if(!lc) return;
  const ctx = lc.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, lc.width, lc.height);
  if(!state.layerSel) return;
  const layer = state.layers.find(l => l.id === state.layerSel);
  if(!layer) return;
  try{
    const doc = await getLayerDoc(layer);
    const pg = await doc.getPage(Math.min(state.currentPage, doc.numPages));
    const v1 = pg.getViewport({ scale: 1 });
    const cssW = (state._vp && state._vp.cssW) || 800;
    const vp = pg.getViewport({ scale: cssW / v1.width });
    const dpr = lc.width / vp.width;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = Math.max(0.1, Math.min(1, state.layerAlpha));
    await pg.render({ canvasContext: ctx, viewport: vp }).promise;
    ctx.globalAlpha = 1;
  }catch(e){}
}
function setLayerSel(v){
  state.layerSel = v || null;
  updateLayerBtn(); renderLayer();
  const ar = $('alphaRow');
  if(ar) ar.style.display = state.layerSel ? 'block' : 'none';
  const list = $('layerList');
  if(list){
    list.querySelectorAll('input[name=lay]').forEach(r =>
      r.checked = (r.value === (state.layerSel || '')));
  }
}

  $('layerTitle').textContent = t('layerTitle');

  $('layerCloseBtn').textContent = t('close');
  const up = $('layerUploadBtn');

  up.textContent = t('layerUpload');
  const ar = $('layerAlphaR');
  ar.value = Math.round(state.layerAlpha * 100);

async function uploadLayer(){
  if(!canEdit() || !state.liveScoreId){
    toast(t('needEdit')); return;
  }
  const name = prompt(t('layerNameAsk'), state.myName || '');
  if(!name) return;
  const fi = $('layerFile');

    try{
      const buf = new Uint8Array(await f.arrayBuffer());
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      const pc = doc.numPages; doc.destroy();
      if(state.numPages && pc !== state.numPages){
        toast(t('layerPageMismatch', { a: state.numPages, b: pc }));
        return;
      }
      const safeName = f.name.replace(/[^\w.\-\u4e00-\u9fa5]/g, '_');
      const path = 'layers/' + Date.now() + '_' + safeName;
      const up = await db.storage.from('scores').upload(path, f,
        { contentType:'application/pdf', upsert:false });
      if(up.error) throw up.error;
      const r = await db.rpc('add_layer', {
        p_edit_pw: epw(), p_score_id: state.liveScoreId,
        p_owner: state.myName, p_name: name.trim().slice(0,40),
        p_file_path: path, p_page_count: pc });
      if(r.error){
        db.storage.from('scores').remove([path]);
        toast(dbErrMsg(r.error));
        return;
      }
      toast(t('layerUploaded'));

      renderLayerList();
    }catch(err){ toast('Error: '+err.message); }

}

async function renderPage(n){
  if(!state.pdf) return;
  n = Math.max(1, Math.min(state.numPages, n));
  state.currentPage = n;
  const page = await state.pdf.getPage(n);
  const stage = $('stage');
  const zoom = state.zoom || 1;
  const baseW = Math.max(320, stage.clientWidth - 16);
  const v1 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: (baseW * zoom) / v1.width });
  state._vp = { cssW: vp.width, cssH: vp.height };
  const canvas = $('pdfCanvas');
  let dpr = Math.min(2, window.devicePixelRatio || 1);
  const MAX_DIM = 8192, MAX_AREA = 16.5e6;
  let cw = vp.width * dpr, ch = vp.height * dpr;
  if(cw > MAX_DIM){ dpr *= MAX_DIM / cw; cw = MAX_DIM; ch = vp.height * dpr; }
  if(cw * ch > MAX_AREA){
    const f = Math.sqrt(MAX_AREA / (cw * ch));
    dpr *= f; cw *= f; ch *= f;
  }
  canvas.width = Math.round(cw); canvas.height = Math.round(ch);
  canvas.style.width = vp.width + 'px';
  canvas.style.height = vp.height + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const ink = $('inkCanvas');
  const lc = $('layerCanvas');
  if(ink){
    ink.width = canvas.width; ink.height = canvas.height;
    ink.style.width = canvas.style.width; ink.style.height = canvas.style.height;
  }
  if(lc){
    lc.width = canvas.width; lc.height = canvas.height;
    lc.style.width = canvas.style.width; lc.style.height = canvas.style.height;
  }
  applyTouchAction();
  await renderLayer();
  redrawInk();
  const pn = $('pageNum');
  if(pn) pn.textContent = n + ' / ' + state.numPages;
  updateZoomUI();
}
async function loadStrokes(){
  if(!state.liveScoreId || state._drawingNow) return;

async function commitZoom(){
  const wrap = $('zoomWrap'); if(wrap) wrap.style.transform = 'scale(1)';
  applyTouchAction();
  const stage = $('stage');
  const oldSW = stage.scrollWidth, oldSH = stage.scrollHeight;
  const oldCX = stage.scrollLeft + stage.clientWidth/2;
  const oldCY = stage.scrollTop + stage.clientHeight/2;
  await renderPage(state.currentPage);
  const rx = oldSW ? oldCX/oldSW : .5;
  const ry = oldSH ? oldCY/oldSH : .5;
  stage.scrollLeft = Math.max(0, rx*stage.scrollWidth - stage.clientWidth/2);
  stage.scrollTop  = Math.max(0, ry*stage.scrollHeight - stage.clientHeight/2);
}
async function resetZoom(){

    ctx.stroke();
  }
  const sv = $('stampPrev');
  if(sv){
    const ctx = sv.getContext('2d');
    ctx.clearRect(0, 0, sv.width, sv.height);
    ctx.strokeStyle = COLORS[state.drawColor];
    ctx.lineWidth = Math.max(1, 2.2 * state.stampScale);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const cy = sv.height/2;
    const sz = Math.max(4, Math.min(sv.height*0.36, 8 + 12*state.stampScale));
    let cx = sv.width*0.28;
    ctx.beginPath();
    ctx.moveTo(cx-sz, cy+sz); ctx.lineTo(cx-sz, cy-sz);
    ctx.lineTo(cx+sz, cy-sz); ctx.lineTo(cx+sz, cy+sz);
    ctx.stroke();
    cx = sv.width*0.72;
    ctx.beginPath();
    ctx.moveTo(cx-sz, cy-sz); ctx.lineTo(cx, cy+sz); ctx.lineTo(cx+sz, cy-sz);
    ctx.stroke();
  }
}

/* ================= 繪製核心 ================= */
function segWidth(ink, th, kind){
  let w = th * (ink.width / 800);
  if(kind === 'HL') w *= 4;
  return Math.max(1, w);
}
function drawPath(ctx, s, W, H){
  const P = s.points;
  if(!P || !P.length) return;
  const ps = parseStroke(s.color);
  ctx.strokeStyle = ps.hex; ctx.fillStyle = ps.hex;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.setLineDash([]);
  if(ps.kind === 'Π' || ps.kind === 'V'){
    const cx = P[0].x*W, cy = P[0].y*H, sz = W*0.024*(ps.sc||1);
    ctx.lineWidth = Math.max(2, ps.th * (W/800));
    ctx.beginPath();
    if(ps.kind === 'Π'){
      ctx.moveTo(cx-sz, cy+sz); ctx.lineTo(cx-sz, cy-sz);
      ctx.lineTo(cx+sz, cy-sz); ctx.lineTo(cx+sz, cy+sz);
    }else{
      ctx.moveTo(cx-sz, cy-sz); ctx.lineTo(cx, cy+sz); ctx.lineTo(cx+sz, cy-sz);
    }
    ctx.stroke(); return;
  }
  if(ps.kind === 'DS' || ps.kind === 'LD') ctx.setLineDash([W*0.012, W*0.010]);
  if(P.length === 1){
    ctx.lineWidth = segWidth({width:W}, ps.th, ps.kind);
    ctx.beginPath(); ctx.arc(P[0].x*W, P[0].y*H, ctx.lineWidth/2, 0, 7); ctx.fill();
    ctx.setLineDash([]); return;
  }
  if(ps.kind === 'LN' || ps.kind === 'LD'){
    ctx.lineWidth = segWidth({width:W}, ps.th, ps.kind);
    ctx.beginPath(); ctx.moveTo(P[0].x*W, P[0].y*H);
    ctx.lineTo(P[P.length-1].x*W, P[P.length-1].y*H);
    ctx.stroke(); ctx.setLineDash([]); return;
  }
  ctx.lineWidth = segWidth({width:W}, ps.th, ps.kind);
  for(let i = 0; i < P.length - 1; i++){
    if(ps.kind === 'HL') ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.moveTo(P[i].x*W, P[i].y*H);
    ctx.lineTo(P[i+1].x*W, P[i+1].y*H);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.setLineDash([]);
}
function drawHalo(ctx, s, W, H){
  const P = s.points;
  if(!P || !P.length) return;
  const ps = parseStroke(s.color);
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = ps.hex; ctx.fillStyle = ps.hex;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.setLineDash([]);
  if(ps.kind === 'Π' || ps.kind === 'V'){
    const cx = P[0].x*W, cy = P[0].y*H, sz = W*0.024*(ps.sc||1);
    ctx.beginPath(); ctx.arc(cx, cy, sz*1.5 + 8, 0, 7); ctx.fill();
    ctx.restore(); return;
  }
  if(P.length === 1){
    const w = Math.max(12, segWidth({width:W}, ps.th, ps.kind) * 2.6);
    ctx.beginPath(); ctx.arc(P[0].x*W, P[0].y*H, w/2, 0, 7); ctx.fill();
    ctx.restore(); return;
  }
  ctx.lineWidth = Math.max(10, segWidth({width:W}, ps.th, ps.kind) * 2.6);
  if(ps.kind === 'LN' || ps.kind === 'LD'){
    if(ps.kind === 'LD') ctx.setLineDash([W*0.012, W*0.010]);
    ctx.beginPath();
    ctx.moveTo(P[0].x*W, P[0].y*H);
    ctx.lineTo(P[P.length-1].x*W, P[P.length-1].y*H);
    ctx.stroke(); ctx.restore(); return;
  }
  for(let i = 0; i < P.length - 1; i++){
    ctx.beginPath();
    ctx.moveTo(P[i].x*W, P[i].y*H);
    ctx.lineTo(P[i+1].x*W, P[i+1].y*H);
    ctx.stroke();
  }
  ctx.restore();
}
function drawTextAt(ctx, tx, W, H){
  const fs = Math.max(4, (tx.size||24) * (W/800));
  const lines = String(tx.content||'').split('\n');
  ctx.font = fs + 'px system-ui, -apple-system, "PingFang TC", sans-serif';
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = fs * 0.15;
  ctx.fillStyle = tx.color || '#1c1c1c';
  lines.forEach((ln, i) => {
    const yy = tx.y*H + i*fs*1.35;
    ctx.strokeText(ln, tx.x*W, yy);
    ctx.fillText(ln, tx.x*W, yy);
  });
}
function redrawInk(previewLine){
  const ink = $('inkCanvas'); if(!ink) return;
  const ctx = ink.getContext('2d');
  ctx.clearRect(0, 0, ink.width, ink.height);
  for(const s of state.strokes) if(isMine(s)) drawHalo(ctx, s, ink.width, ink.height);
  for(const s of state.strokes) drawPath(ctx, s, ink.width, ink.height);
  for(const tx of state.texts) drawTextAt(ctx, tx, ink.width, ink.height);
  if(previewLine && previewLine.length === 2){
    drawPath(ctx, { color: encodeStroke(
      state.dash ? 'LD' : 'LN', COLORS[state.drawColor], state.thick),
      points: previewLine }, ink.width, ink.height);
  }
}
function hitStroke(px, py){
  const ink = $('inkCanvas'); if(!ink) return null;
  const W = ink.width, H = ink.height;
  const tol = Math.max(16, W*0.014);
  let other = null;
  for(let i = state.strokes.length - 1; i >= 0; i--){
    const s = state.strokes[i];
    for(const p of s.points){
      const dx = p.x*W - px, dy = p.y*H - py;
      if(dx*dx + dy*dy < tol*tol){
        if(isMine(s) || isAdmin()) return s;
        if(!other) other = s;
        break;
      }
    }
  }
  return other;
}
let measureCtx = null;
function hitText(px, py){
  const ink = $('inkCanvas'); if(!ink || !state.texts.length) return null;
  const W = ink.width, H = ink.height;
  if(!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
  for(let i = state.texts.length - 1; i >= 0; i--){
    const tx = state.texts[i];
    const fs = Math.max(4, (tx.size||24) * (W/800));
    measureCtx.font = fs + 'px system-ui, -apple-system, "PingFang TC", sans-serif';
    const lines = String(tx.content||'').split('\n');
    let w = 0;
    lines.forEach(ln => { w = Math.max(w, measureCtx.measureText(ln).width); });
    const x0 = tx.x*W - 6, y0 = tx.y*H - 6;
    const bw = w + 12, bh = lines.length*fs*1.35 + 12;
    if(px >= x0 && px <= x0+bw && py >= y0 && py <= y0+bh) return tx;
  }
  return null;
}
async function eraseAt(p){
  const ink = $('inkCanvas'); if(!ink) return;
  const s = hitStroke(p.x*ink.width, p.y*ink.height);
  if(!s) return;
  const owner = ownerOf(s);
  const mine = isMine(s);
  if(!mine && !isAdmin()){ toast(t('notYours', { n: owner })); return; }
  const { error } = await db.rpc('delete_stroke',
    { p_edit_pw: epw(), p_stroke_id: s.id });
  if(error){ toast(dbErrMsg(error)); return; }
  state.strokes = state.strokes.filter(x => x.id !== s.id);
  redrawInk();
  toast(mine ? t('eraseOk') : t('chiefErased', { n: owner }));
}

async function saveText(){
  const content = $('textArea').value.trim();
  if(!content){ toast(t('textNeedContent')); return; }
  const size = state.textSize;
  const color = COLORS[state.textColor] || '#1c1c1c';
  if(textEditing){
    const { error } = await db.rpc('update_text', {
      p_edit_pw: epw(), p_text_id: textEditing.id,
      p_content: content, p_size: size, p_color: color });
    if(error){ toast(dbErrMsg(error)); return; }
    Object.assign(textEditing, { content, size, color });
    toast(t('textUpdated'));
  }else{
    if(!state.liveScoreId || !textPos){ closeTextPop(); return; }
    const r = await db.rpc('add_text', {
      p_edit_pw: epw(), p_score_id: state.liveScoreId,
      p_page: state.currentPage, p_name: state.myName,
      p_content: content, p_x: textPos.x, p_y: textPos.y,
      p_size: size, p_color: color });
    if(r.error){ toast(dbErrMsg(r.error)); return; }
    state.texts.push({ id: r.data, drawer_name: state.myName,
      page: state.currentPage, content, x: textPos.x, y: textPos.y, size, color });
    toast(t('textSaved'));
  }
  closeTextPop(); redrawInk();
}
async function deleteText(){
  if(!textEditing) return;
  if(!isMine(textEditing) && !isAdmin()){
    toast(t('textNotYours', { n: ownerOf(textEditing) })); return;
  }
  if(!confirm(t('confirmDelText'))) return;
  const { error } = await db.rpc('delete_text',
    { p_edit_pw: epw(), p_text_id: textEditing.id });
  if(error){ toast(dbErrMsg(error)); return; }
  state.texts = state.texts.filter(x => x.id !== textEditing.id);
  toast(t('textDeleted'));
  closeTextPop(); redrawInk();
}

/* ================= 清除確認 ================= */
let clearKind = null;
let undoData = null;
let undoTimer = null;
function openClearConfirm(kind){
  if(kind === 'all' && !isAdmin()){ toast(t('needEdit')); return; }
  if(kind === 'mine' && !canEdit()){ toast(t('needEdit')); return; }
  clearKind = kind;
  const mine = state.strokes.filter(isMine);
  const isAll = kind === 'all';
  if(isAll && !state.strokes.length && !state.texts.length){
    toast(t('nothingMine')); return;
  }
  if(!isAll && !mine.length){ toast(t('nothingMine')); return; }
  $('clearTitle').textContent = isAll ? t('clearAllT') : t('clearMineT');
  let body;
  if(isAll){
    body = t('clearAllBody', { p: state.currentPage, n: state.strokes.length });
    if(state.texts.length){
      body += '<br>' + t('clearAllTxtBody', { m: state.texts.length });
    }
    if(state.strokes.length){
      const byOwner = {};
      state.strokes.forEach(s => {
        const o = ownerOf(s);
        byOwner[o] = (byOwner[o]||0) + 1;
      });
      body += '<br>' + Object.entries(byOwner)
        .map(([o,c]) => `<span class="own">✍️ ${esc(o)}：${c}</span>`).join(' ');
    }
  }else{
    body = t('clearMineBody', { p: state.currentPage, n: mine.length });
  }
  body += `<br><br>${t('clearUndoHint')}`;
  $('clearBody').innerHTML = body;
  $('clearCancel').textContent = t('clearCancel');
  $('clearGo').textContent = isAll ? t('clearGoAll') : t('clearGoMine');
  $('clearGo').onclick = () => {
    closeClearPop();
    if(clearKind === 'all') doClearAll(); else doClearMine();
  };
  $('clearPop').style.display = 'block';
  $('clearOverlay').style.display = 'block';
}
function closeClearPop(){
  $('clearPop').style.display = 'none';
  $('clearOverlay').style.display = 'none';
}
function showUndoChip(){
  const chip = $('undoChip');
  if(!chip) return;
  chip.style.display = 'inline-flex';
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => {
    chip.style.display = 'none';
    undoData = null;
  }, 30000);
}
async function undoCleared(){
  if(!undoData || (!undoData.strokes.length && !(undoData.texts||[]).length)) return;
  const d = undoData; undoData = null;
  $('undoChip').style.display = 'none';
  let fail = 0;
  for(const s of d.strokes){
    try{
      const r = await db.rpc('add_stroke', {
        p_edit_pw: epw(), p_score_id: d.scoreId,
        p_page: d.page, p_name: s.drawer_name || '',
        p_color: s.color, p_points: s.points });
      if(r.error) fail++;
    }catch(e){ fail++; }
  }
  for(const tx of (d.texts||[])){
    try{
      const r = await db.rpc('add_text', {
        p_edit_pw: epw(), p_score_id: d.scoreId,
        p_page: d.page, p_name: tx.drawer_name || '',
        p_content: tx.content, p_x: tx.x, p_y: tx.y,
        p_size: tx.size, p_color: tx.color });
      if(r.error) fail++;
    }catch(e){ fail++; }
  }
  if(state.currentPage !== d.page){ await goTo(d.page, false); }
  else{ await Promise.all([loadStrokes(), loadTexts()]); }
  toast(fail ? t('undoClearedFail') : t('undoClearedOk'));
}
async function doClearMine(){
  if(!canEdit()) return;
  const mine = state.strokes.filter(isMine);
  if(!mine.length){ toast(t('nothingMine')); return; }
  undoData = { page: state.currentPage, scoreId: state.liveScoreId,
    strokes: mine.map(s => ({ drawer_name: s.drawer_name, color: s.color, points: s.points })),
    texts: [] };
  state._drawingNow = true;
  for(const s of mine){
    await db.rpc('delete_stroke', { p_edit_pw: epw(), p_stroke_id: s.id });
  }
  state._drawingNow = false;
  state.strokes = state.strokes.filter(s => !isMine(s));
  redrawInk(); toast(t('clearPageOk'));
  showUndoChip();
}
async function doClearAll(){
  if(!isAdmin()) return;
  if(!state.strokes.length && !state.texts.length){
    toast(t('nothingMine')); return;
  }
  /* 儲存復原資料：弓法＋文字 */
  undoData = { page: state.currentPage, scoreId: state.liveScoreId,
    strokes: state.strokes.map(s => ({ drawer_name: s.drawer_name, color: s.color, points: s.points })),
    texts: state.texts.map(tx => ({ drawer_name: tx.drawer_name,
      content: tx.content, x: tx.x, y: tx.y, size: tx.size, color: tx.color })) };
  state._drawingNow = true;  /* 批次刪除期間暫停 realtime 重載 */
  for(const s of state.strokes.slice()){
    await db.rpc('delete_stroke', { p_edit_pw: epw(), p_stroke_id: s.id });
  }
  /* ⭐ 文字標註一併清除 */
  for(const tx of state.texts.slice()){
    await db.rpc('delete_text', { p_edit_pw: epw(), p_text_id: tx.id });
  }
  state._drawingNow = false;
  state.strokes = [];
  state.texts = [];
  redrawInk(); toast(t('clearAllOk'));
  showUndoChip();
}

/* ================= pointer 繪製 ================= */
function setupInk(){
  const ink = $('inkCanvas');
  if(!ink || ink._bound) return;
  ink._bound = true;
  ink.addEventListener('contextmenu', e => e.preventDefault());
  let drawing = false, erasing = false, last = null, pts = [], lineStart = null, textDrag = null;
  const pos = e => {
    const r = ink.getBoundingClientRect();
    return { x: +((e.clientX - r.left)/r.width).toFixed(4),
             y: +((e.clientY - r.top)/r.height).toFixed(4) };
  };
  const cancel = () => {
    if(textDrag){
      textDrag.tx.x = textDrag.sx0; textDrag.tx.y = textDrag.sy0;
      textDrag = null; redrawInk();
    }
    if(drawing || erasing){
      drawing = false; erasing = false; state._drawingNow = false;
      redrawInk();
    }
  };
  window.__cancelDraw = cancel;
  const ensureEditor = () => {
    if(canEdit()) return true;
    toast(t('needEdit')); openRolePop();
    return false;
  };
  const ensureName = () => {
    if(state.myName && nameIsSafe(state.myName)) return true;
    const v = askSafeName(state.myName);
    if(!v) return false;
    state.myName = v;
    localStorage.setItem('drawerName', v);
    updateRoleUI();
    return true;
  };
  ink.addEventListener('pointerdown', e => {
    if(e.pointerType === 'eraser' ||
       (e.pointerType === 'pen' && (e.buttons & 32))){
      setTempErase(true);
    }
    if(e.pointerType === 'pen' || e.pointerType === 'eraser'){
      lastPenDown = Date.now();
    }
    if(e.pointerType === 'touch' && Date.now() - lastPenDown < 2000) return;
    if(!state.tool) return;
    if(!ensureEditor()) return;
    if(drawing || erasing || textDrag) return;
    if(!ensureName()) return;
    e.preventDefault();
    try{ ink.setPointerCapture(e.pointerId); }catch(err){}
    const p = pos(e);
    if(state.tool === 'text'){
      const hit = hitText(p.x*ink.width, p.y*ink.height);
      if(hit){
        if(!isMine(hit) && !isAdmin()){
          toast(t('textNotYours', { n: ownerOf(hit) }));
          return;
        }
        textDrag = { tx: hit, ox: p.x, oy: p.y, sx0: hit.x, sy0: hit.y, moved: false };
      }else{
        openTextDialog(null, { x: p.x, y: p.y });
      }
      return;
    }
    const wantErase = state.tool === 'erase' || e.pointerType === 'eraser' || (e.buttons & 32);
    if(wantErase){ erasing = true; state._drawingNow = true; eraseAt(p); return; }
    if(state.tool === 'stampDown' || state.tool === 'stampUp'){
      commitStamp(p); return;
    }
    drawing = true; state._drawingNow = true;
    pts = [p];
    lineStart = (state.tool === 'line') ? p : null;
    if(!lineStart){
      last = { x: p.x*ink.width, y: p.y*ink.height };
      const ctx = ink.getContext('2d');
      styleCur(ctx); ctx.beginPath();
      ctx.arc(last.x, last.y, ctx.lineWidth/2, 0, 7); ctx.fill();
    }
  });
  ink.addEventListener('pointermove', e => {
    if(e.pointerType === 'pen' || e.pointerType === 'eraser'){
      lastPenDown = Date.now();
    }
    if(erasing){
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for(const ev of evs) eraseAt(pos(ev));
      return;
    }
    if(textDrag){
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      const p = pos(evs[evs.length-1]);
      const dx = p.x - textDrag.ox, dy = p.y - textDrag.oy;
      if(!textDrag.moved && Math.hypot(dx, dy) > 0.015) textDrag.moved = true;
      if(textDrag.moved){
        textDrag.tx.x = Math.min(1, Math.max(0, textDrag.sx0 + dx));
        textDrag.tx.y = Math.min(1, Math.max(0, textDrag.sy0 + dy));
        redrawInk();
      }
      return;
    }
    if(!drawing) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if(lineStart){
      const q = pos(evs[evs.length-1]);
      redrawInk([lineStart, q]);
      return;
    }
    const ctx = ink.getContext('2d');
    styleCur(ctx);
    for(const ev of evs){
      const p = pos(ev); pts.push(p);
      const q = { x: p.x*ink.width, y: p.y*ink.height };
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      last = q;
    }
  });
  const finish = async () => {
    if(erasing){ erasing = false; state._drawingNow = false; return; }
    if(textDrag){
      const td = textDrag; textDrag = null;
      if(td.moved){
        const { error } = await db.rpc('update_text', {
          p_edit_pw: epw(), p_text_id: td.tx.id,
          p_x: td.tx.x, p_y: td.tx.y });
        if(error){
          toast(dbErrMsg(error));
          td.tx.x = td.sx0; td.tx.y = td.sy0; redrawInk();
        }else toast(t('textMovedOk'));
      }else openTextDialog(td.tx);
      return;
    }
    if(!drawing) return;
    drawing = false; state._drawingNow = false;
    if(lineStart && pts.length >= 1){
      redrawInk([lineStart, pts[pts.length-1]]);
      pts = [lineStart, pts[pts.length-1]];
    }
    if(pts.length < 1 || !state.liveScoreId){ redrawInk(); return; }
    const kind = (state.tool === 'hl') ? 'HL'
      : (state.tool === 'line') ? (state.dash ? 'LD' : 'LN')
      : (state.dash ? 'DS' : 'P');
    const r = await db.rpc('add_stroke', {
      p_edit_pw: epw(), p_score_id: state.liveScoreId,
      p_page: state.currentPage, p_name: state.myName,
      p_color: encodeStroke(kind, COLORS[state.drawColor], state.thick),
      p_points: pts });
    if(r.error){
      toast(dbErrMsg(r.error));
      redrawInk(); return;
    }
    state.strokes.push({ id: r.data, drawer_name: state.myName,
      color: encodeStroke(kind, COLORS[state.drawColor], state.thick), points: pts });
    redrawInk();
  };
  ink.addEventListener('pointerup', e => {
    if(e.pointerType === 'pen' || e.pointerType === 'eraser'){
      lastPenDown = Date.now();
      setTempErase(false);
    }
    finish();
  });
  ink.addEventListener('pointercancel', e => {
    if(e.pointerType === 'pen' || e.pointerType === 'eraser') setTempErase(false);
    cancel();
  });
  function styleCur(ctx){
    const ps = parseStroke(encodeStroke(
      (state.tool === 'hl') ? 'HL' : (state.dash ? 'DS' : 'P'),
      COLORS[state.drawColor], state.thick));
    ctx.strokeStyle = ps.hex; ctx.fillStyle = ps.hex;
    ctx.lineWidth = segWidth(ink, ps.th, ps.kind);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalAlpha = (state.tool === 'hl') ? 0.35 : 1;
    ctx.setLineDash([]);
  }
  async function commitStamp(p){
    state._drawingNow = true;
    const kind = (state.tool === 'stampDown') ? 'Π' : 'V';
    const enc = encodeStroke(kind, COLORS[state.drawColor], state.thick, state.stampScale);
    const r = await db.rpc('add_stroke', {
      p_edit_pw: epw(), p_score_id: state.liveScoreId,
      p_page: state.currentPage, p_name: state.myName,
      p_color: enc, p_points: [p] });
    if(r.error){
      toast(dbErrMsg(r.error));
    }else{
      state.strokes.push({ id: r.data, drawer_name: state.myName, color: enc, points: [p] });
      redrawInk();
    }
    state._drawingNow = false;
  }
}
async function undoStroke(){
  if(!canEdit()){ toast(t('needEdit')); return; }
  const mine = state.strokes.filter(isMine);
  if(!mine.length){ toast(t('nothingUndo')); return; }
  const lastS = mine[mine.length - 1];
  const { error } = await db.rpc('delete_stroke',
    { p_edit_pw: epw(), p_stroke_id: lastS.id });
  if(error){ toast(dbErrMsg(error)); return; }
  state.strokes = state.strokes.filter(s => s.id !== lastS.id);
  redrawInk(); toast(t('undoOk'));
}

/* ================= 列印 / 匯出 ================= */
function openPrintPop(){
  const pop = $('printPop'); if(!pop) return;
  pop.style.display = 'block';
  $('printProg').textContent = '';
  const sl = localStorage.getItem('printLayer'), ss = localStorage.getItem('printScope');
  if(sl){
    const el = document.querySelector('input[name=pl][value="'+sl+'"]');
    if(el) el.checked = true;
  }
  if(ss){
    const el = document.querySelector('input[name=ps][value="'+ss+'"]');
    if(el) el.checked = true;
  }
}
function closePrintPop(){
  const pop = $('printPop'); if(pop) pop.style.display = 'none';
}
function getPrintOpts(){
  return {
    layer: document.querySelector('input[name=pl]:checked').value,
    scope: document.querySelector('input[name=ps]:checked').value
  };
}
function savePrintOpts(o){
  localStorage.setItem('printLayer', o.layer);
  localStorage.setItem('printScope', o.scope);
}
async function fetchLayers(){
  const strokesBy = {}, textsBy = {};
  try{
    const a = await db.from('strokes').select('*')
      .eq('score_id', state.liveScoreId).order('created_at');
    (a.data||[]).forEach(s => { (strokesBy[s.page] = strokesBy[s.page]||[]).push(s); });
    const b = await db.from('texts').select('*')
      .eq('score_id', state.liveScoreId).order('created_at');
    (b.data||[]).forEach(x => { (textsBy[x.page] = textsBy[x.page]||[]).push(x); });
  }catch(e){}
  return { strokesBy, textsBy };
}
async function compositePage(n, layer, strokesBy, textsBy){
  const page = await state.pdf.getPage(n);
  const v1 = page.getViewport({ scale: 1 });
  const scale = 1600 / v1.width;
  const vp = page.getViewport({ scale });
  const cv = document.createElement('canvas');
  cv.width = Math.round(1600);
  cv.height = Math.round(v1.height * scale);
  const c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
  await page.render({ canvasContext: c, viewport: vp }).promise;
  if(layer !== 'text') (strokesBy[n]||[]).forEach(s => drawPath(c, s, cv.width, cv.height));
  if(layer !== 'bow') (textsBy[n]||[]).forEach(x => drawTextAt(c, x, cv.width, cv.height));
  return cv;
}
async function doPrint(){
  if(!state.pdf || !state.liveScoreId) return;
  const opts = getPrintOpts(); savePrintOpts(opts);
  const pages = (opts.scope === 'all')
    ? Array.from({ length: state.numPages }, (_, i) => i + 1)
    : [state.currentPage];
  const { strokesBy, textsBy } = await fetchLayers();
  const area = $('printArea'); area.innerHTML = '';
  closePrintPop();
  for(let i = 0; i < pages.length; i++){
    toast(t('printing') + ' ' + (i+1) + '/' + pages.length);
    try{
      const cv = await compositePage(pages[i], opts.layer, strokesBy, textsBy);
      const img = document.createElement('img');
      img.src = cv.toDataURL('image/jpeg', 0.88);
      area.appendChild(img);
    }catch(e){}
  }
  document.body.classList.add('printing');
  setTimeout(() => { try{ window.print(); }catch(e){} }, 120);
  setTimeout(() => {
    document.body.classList.remove('printing');
    area.innerHTML = '';
  }, 90000);
}
async function doExport(){
  if(!state.pdf || !state.liveScoreId) return;
  if(!window.jspdf || !window.jspdf.jsPDF){ toast(t('noPdfLib')); return; }
  const opts = getPrintOpts(); savePrintOpts(opts);
  const pages = (opts.scope === 'all')
    ? Array.from({ length: state.numPages }, (_, i) => i + 1)
    : [state.currentPage];
  const { strokesBy, textsBy } = await fetchLayers();
  closePrintPop();
  const { jsPDF } = window.jspdf;
  let doc = null;
  const title = (($('vTitle') && $('vTitle').textContent) || 'score')
    .replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
  for(let i = 0; i < pages.length; i++){
    toast(t('printing') + ' ' + (i+1) + '/' + pages.length);
    try{
      const cv = await compositePage(pages[i], opts.layer, strokesBy, textsBy);
      const orient = cv.width > cv.height ? 'l' : 'p';
      if(!doc) doc = new jsPDF({ orientation: orient, unit:'pt', format:'a4' });
      else doc.addPage('a4', orient);
      const pw = doc.internal.pageSize.getWidth();
      const ph = doc.internal.pageSize.getHeight();
      const m = 10;
      const r = Math.min((pw - 2*m) / cv.width, (ph - 2*m) / cv.height);
      doc.addImage(cv.toDataURL('image/jpeg', 0.86), 'JPEG',
        (pw - cv.width*r) / 2, (ph - cv.height*r) / 2, cv.width*r, cv.height*r);
    }catch(e){}
  }
  if(doc) doc.save(title + '.pdf');
  toast(t('exportDone'));
}
window.addEventListener('afterprint', () => {
  document.body.classList.remove('printing');
  const area = $('printArea'); if(area) area.innerHTML = '';
});

/* ================= 手勢 ================= */
let stageBound = false;
let pinchS = null, justPinched = false;
function setupStageGestures(){
  const stage = $('stage');
  if(stageBound || !stage) return;
  stageBound = true;
  stage.addEventListener('touchstart', e => {
    if(e.touches.length === 2){
      if(window.__cancelDraw) window.__cancelDraw();
      const t0 = e.touches[0], t1 = e.touches[1];
      const dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY;
      pinchS = { d0: Math.hypot(dx, dy) || 1, z0: state.zoom,
        mx: (t0.clientX + t1.clientX)/2, my: (t0.clientY + t1.clientY)/2,
        sl: stage.scrollLeft, st: stage.scrollTop };
      justPinched = true;
      return;
    }
    if(e.touches.length === 1){
      stage._sx = e.touches[0].clientX;
      stage._moved = false;
    }
  }, { passive:true });
  stage.addEventListener('touchmove', e => {
    if(pinchS && e.touches.length === 2){
      e.preventDefault();
      const t0 = e.touches[0], t1 = e.touches[1];
      const dist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
      const z = Math.max(1, Math.min(ZOOM_MAX, pinchS.z0 * dist / pinchS.d0));
      state.zoom = z;
      const wrap = $('zoomWrap');
      if(wrap) wrap.style.transform = `scale(${z})`;
      const mx = (t0.clientX + t1.clientX)/2, my = (t0.clientY + t1.clientY)/2;
      stage.scrollLeft = Math.max(0, pinchS.sl - (mx - pinchS.mx));
      stage.scrollTop  = Math.max(0, pinchS.st - (my - pinchS.my));
      updateZoomUI();
      return;
    }
    if(e.touches.length === 1 && typeof stage._sx === 'number'){
      if(Math.abs(e.touches[0].clientX - stage._sx) > 50) stage._moved = true;
    }
  }, { passive:false });
  stage.addEventListener('touchend', e => {
    if(pinchS && e.touches.length < 2){
      pinchS = null;
      commitZoom();
      return;
    }
    if(justPinched){
      if(e.touches.length === 0) justPinched = false;
      return;
    }
    if(state.tool && canEdit()) return;
    if(state.zoom > 1) return;
    if(!e.changedTouches.length) return;
    e.preventDefault();
    const x = e.changedTouches[0].clientX;
    const sx = stage._sx;
    if(typeof sx === 'number' && !stage._moved){
      const w = stage.clientWidth;
      if(x > w * 0.66) goTo(state.currentPage + 1);
      else if(x < w * 0.33) goTo(state.currentPage - 1);
    }else if(typeof sx === 'number'){
      const dx = x - sx;
      if(dx < -60) goTo(state.currentPage + 1);
      else if(dx > 60) goTo(state.currentPage - 1);
    }
  });
  stage.addEventListener('click', e => {
    if(justPinched){ justPinched = false; return; }
    if(state.tool && canEdit()) return;
    if(state.zoom > 1) return;
    const w = stage.clientWidth;
    if(e.clientX > w * 0.66) goTo(state.currentPage + 1);
    else if(e.clientX < w * 0.33) goTo(state.currentPage - 1);
  });
  document.addEventListener('keydown', e => {
    if(!inViewerPage()) return;
    if(e.key === 'ArrowRight') goTo(state.currentPage + 1);
    if(e.key === 'ArrowLeft') goTo(state.currentPage - 1);
    if(e.key === 'Escape' && state.fsMode) toggleFullscreen();
  });
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    fitHeader();
    if(inViewerPage() && state.pdf){
      renderPage(state.currentPage).then(() => Promise.all([loadStrokes(), loadTexts()]));
    }
  }, 300);
});

  };
  $('view').innerHTML = `

    ${zh ? '右上角「EN」任何頁面切換。' : 'Tap "中" (top right).'}
  </div></details>`;
}

/* ================= Realtime ================= */
db.channel('live-broadcast')
  .on('postgres_changes', { event:'*', schema:'public', table:'broadcast' }, async () => {
    if(inViewerPage()){
      const prevLive = state.isLiveHere;
      await applyBroadcastState();
      if(!prevLive && state.isLiveHere){
        await goTo(state.masterPage, false);
      }
    }
    else if(isHome()){
      if(gatePassed()) renderHome();
    }
  })
  .on('postgres_changes', { event:'*', schema:'public', table:'strokes' }, () => {
    if(inViewerPage()) loadStrokes();
  })
  .on('postgres_changes', { event:'*', schema:'public', table:'texts' }, () => {
    if(inViewerPage()) loadTexts();
  })
  .on('postgres_changes', { event:'*', schema:'public', table:'layers' }, () => {
    if(state.liveScoreId) loadLayers(state.liveScoreId);
  })
  .on('postgres_changes', { event:'*', schema:'public', table:'editors' }, () => {
    if(state.isEditor) heartbeat();
  })
  .on('postgres_changes', { event:'*', schema:'public', table:'announcements' }, () => {
    if(isHome() && state.homeTab === 'ann') renderAnnBoard();
  })
  .subscribe();

/* ================= 啟動 ================= */
(async function boot(){
  const apw = localStorage.getItem('adminPw');
  const cpw = localStorage.getItem('chiefPw');
  const pw = apw || cpw;
  if(pw){
    try{
      const { data } = await db.rpc('verify_admin_pw', { p_admin_pw: pw });
      if(data){
        state.adminPw = pw;
        state.isChief = true;
        if(!apw) localStorage.setItem('adminPw', pw);
      }else{
        localStorage.removeItem('adminPw');
        localStorage.removeItem('chiefPw');
      }
    }catch(e){}
  }
  if(!gatePassed()) renderGate();
  else{
    $('roleBtn').style.display = 'inline-flex';
    updateRoleUI();
    if(!location.hash) location.hash = '#/library';
    route();
  }
})();
</script>
